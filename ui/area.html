<!doctype html>
<html><head><meta charset="utf-8" /><title>Select area</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: rgba(0,0,0,.35); cursor: crosshair; font: 12px -apple-system, system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  #sel { position: fixed; border: 2px solid #7d71ff; background: rgba(0,0,0,0); box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); display: none; }
  #lab { position: fixed; padding: 3px 8px; background: #12131a; color: #fff; border-radius: 6px; display: none; }
  #hint { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #12131a; color: #e9eaf2; padding: 8px 14px; border-radius: 10px; border: 1px solid #333; }
</style></head>
<body>
<div id="hint">Drag to select the area to record · Esc to cancel</div>
<div id="sel"></div><div id="lab"></div>
<script type="module" src="js/area.js"></script>
</body></html>
