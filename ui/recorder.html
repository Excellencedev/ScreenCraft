<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>ScreenCraft</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { overflow: hidden; }
  #root { height: 100%; display: flex; flex-direction: column; justify-content: flex-end; }
  .bar {
    -webkit-app-region: drag;
    height: 76px; display: flex; align-items: center; gap: 2px; padding: 0 10px; overflow: hidden;
    background: rgba(28, 29, 36, .94); border: 1px solid rgba(255,255,255,.09);
    border-radius: 16px; backdrop-filter: blur(24px);
  }
  .bar > * { -webkit-app-region: no-drag; }
  .sep { width: 1px; height: 38px; background: rgba(255,255,255,.1); margin: 0 6px; }
  .tool {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 58px; padding: 8px 2px 6px; border-radius: 10px; color: #c9cbd8; font-size: 11px;
  }
  .tool svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tool:hover { background: rgba(255,255,255,.07); }
  .tool.active { background: rgba(59,130,196,.28); color: #fff; }
  .opt { display: flex; align-items: center; gap: 8px; padding: 8px 8px; border-radius: 10px; color: #c9cbd8; max-width: 128px; white-space: nowrap; }
  .opt svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }
  .opt span { overflow: hidden; text-overflow: ellipsis; }
  .opt:hover { background: rgba(255,255,255,.07); }
  .opt.on { color: #fff; }
  .opt.off { opacity: .6; }
  #camPreview, #hudCam { display: none; width: 40px; height: 40px; border-radius: 50%; object-fit: cover; transform: scaleX(-1); background: #000; flex: none; }
  .opt.live #camPreview { display: block; }
  .opt.live > svg { display: none; }
  #hudCam.on { display: block; width: 36px; height: 36px; }
  .opt { position: relative; }
  #optQuality { max-width: 190px; }
  .menu { max-height: 500px; }
  .opt .meter { position: absolute; left: 10px; right: 10px; bottom: 2px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.1); overflow: hidden; display: none; }
  .opt.on .meter { display: block; }
  .meter b { display: block; height: 100%; width: 0; border-radius: 2px; background: linear-gradient(90deg, #4ade80 0%, #4ade80 65%, #facc15 80%, #f87171 100%); transition: width .05s linear; }
  .meter.hud { position: static; display: none; width: 34px; height: 5px; border-radius: 3px; background: rgba(255,255,255,.14); overflow: hidden; margin-left: 2px; }
  body.hud .meter.hud { display: block; }
  .menu button .chk { display: inline-block; width: 16px; color: var(--accent-2); }
  .chev2 { width: 12px !important; height: 12px !important; }
  body.hud .bar, body.countdown .bar { cursor: grab; }
  .close { width: 28px; height: 28px; border-radius: 50%; background: #fff; color: #111; display: grid; place-items: center; margin-right: 6px; }
  .close svg { width: 14px; height: 14px; stroke: #111; stroke-width: 2.4; fill: none; }
  .rec {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
    background: var(--accent); color: #fff; border-radius: 12px; padding: 12px 18px; font-weight: 600;
  }
  .rec:hover { background: var(--accent-2); }
  .rec { white-space: nowrap; flex: none; }
  .rec .dot { width: 10px; height: 10px; border-radius: 50%; background: #fff; }
  .menu {
    position: absolute; bottom: 84px; background: rgba(28,29,36,.97); border: 1px solid rgba(255,255,255,.1);
    border-radius: 12px; padding: 6px; max-height: 300px; overflow: auto; min-width: 300px; display: none; z-index: 5;
  }
  .menu.show { display: block; }
  .menu button { white-space: nowrap; display: block; width: 100%; text-align: left; padding: 8px 10px; border-radius: 8px; color: #dcdeea; }
  .menu button:hover { background: rgba(255,255,255,.08); }
  .menu .small { color: var(--muted); font-size: 11px; }
  .menu .hd { color: var(--muted); font-size: 11px; padding: 6px 10px 2px; }
  /* HUD while recording */
  body.hud .bar > :not(.hudbox) { display: none !important; }
  .hudbox { display: none; align-items: center; gap: 14px; width: 100%; justify-content: space-between; }
  body.hud .hudbox { display: flex; }
  body.countdown .bar > :not(.hudbox) { display: none !important; }
  body.countdown .hudbox { display: flex; }
  .pulse { width: 12px; height: 12px; border-radius: 50%; background: var(--danger); animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .time { font-variant-numeric: tabular-nums; font-size: 18px; font-weight: 600; }
  .stop { background: var(--danger); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; }
  .count { font-size: 30px; font-weight: 700; width: 100%; text-align: center; }
  .err { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 20; background: rgba(58,17,23,.97); border: 1px solid #7b2230; padding: 10px 16px; border-radius: 16px; display: none; align-items: center; cursor: pointer; line-height: 1.35; }
</style>
</head>
<body>
<div id="root">
  <div class="err" id="err"></div>
  <div class="menu" id="menu"></div>
  <video id="camSrc" muted playsinline style="position:fixed;left:0;top:0;width:160px;height:90px;opacity:0.01;pointer-events:none;z-index:-1"></video>
  <div class="bar" id="bar">
    <button class="close" id="btnClose" title="Close"><svg viewBox="0 0 16 16"><path d="M3 3l10 10M13 3L3 13"/></svg></button>
    <div class="sep"></div>
    <button class="tool" data-mode="display"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2.5"/><path d="M3 13h18"/></svg>Display</button>
    <button class="tool" data-mode="window"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 9h18"/></svg>Window</button>
    <button class="tool" data-mode="area"><svg viewBox="0 0 24 24"><path stroke-dasharray="3 3" d="M5 5h14v14H5z"/></svg>Area</button>
    <div class="sep"></div>
    <button class="opt off" id="optCamera"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3z"/></svg><canvas id="camPreview" width="80" height="80"></canvas><span class="t">No camera</span></button>
    <button class="opt off" id="optMic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg><span class="t">No microphone</span><i class="meter" id="micMeter"><b></b></i></button>
    <button class="opt off" id="optSys"><svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 010 6"/></svg><span class="t">No system audio</span><i class="meter" id="sysMeter"><b></b></i></button>
    <div class="sep"></div>
    <button class="opt" id="optQuality" title="Resolution & frame rate"><svg viewBox="0 0 24 24"><path d="M4 18V9M10 18V5M16 18v-7M22 18H2"/></svg><span id="qualLabel">2560 · 30 fps</span><svg class="chev2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="opt" id="optFolder" title="Open projects"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></button>
    <button class="rec" id="btnRec"><span class="dot"></span><span id="recLabel">Record</span></button>
    <div class="hudbox">
      <div id="hudLeft" style="display:flex;align-items:center;gap:10px"><canvas id="hudCam" width="72" height="72"></canvas><div class="pulse"></div><div class="time" id="timer">0:00</div><i class="meter hud" id="hudMic" title="Microphone"><b></b></i><i class="meter hud sys" id="hudSys" title="System audio"><b></b></i></div>
      <div class="count" id="count" style="display:none"></div>
      <button class="stop" id="btnStop">Stop</button>
    </div>
  </div>
</div>
<script type="module" src="js/recorder/main.js"></script>
</body>
</html>
