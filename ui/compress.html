<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Compress video</title>
<link rel="stylesheet" href="theme.css" />
<style>
  html, body { background: var(--bg); overflow: hidden; }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  #wrap { display: grid; grid-template-columns: 230px 1fr; height: 100vh; }
  #presets { border-right: 1px solid #14151f; padding: 52px 12px 12px; overflow: auto; background: #0a0b10; }
  #presets h4 { margin: 0 8px 10px; color: var(--muted); font-weight: 500; text-transform: uppercase; font-size: 11px; letter-spacing: .08em; }
  .preset { display: block; width: 100%; text-align: left; padding: 9px 10px; border-radius: 9px; color: #cfd1e0; }
  .preset small { display: block; color: var(--muted); margin-top: 2px; }
  .preset:hover { background: #151620; }
  .preset.on { background: #1d1f2d; color: #fff; }
  #main { padding: 52px 24px 20px; overflow: auto; display: flex; flex-direction: column; gap: 16px; }
  .card { background: var(--panel); border: 1px solid #1a1b26; border-radius: 14px; padding: 16px; }
  .drop { display: flex; align-items: center; gap: 14px; }
  .drop .name { font-weight: 600; max-width: 380px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .muted { color: var(--muted); }
  .btn { background: #181925; border: 1px solid #202233; padding: 8px 14px; border-radius: 9px; }
  .btn:hover { background: #20222f; }
  .primary { background: var(--accent); color: #fff; padding: 10px 18px; border-radius: 10px; font-weight: 600; }
  .primary:hover { background: var(--accent-2); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 20px; }
  .field label { display: flex; justify-content: space-between; color: #c8cadb; margin-bottom: 7px; }
  select { width: 100%; background: #151620; border: 1px solid #1f2130; border-radius: 8px; padding: 7px 9px; }
  input[type=range] { width: 100%; accent-color: var(--accent-2); }
  .full { grid-column: 1 / -1; }
  .bar { height: 8px; background: #20222f; border-radius: 4px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent-2); transition: width .15s; }
  .est { display: flex; justify-content: space-between; align-items: center; }
  .big { font-size: 20px; font-weight: 650; }
  .row { display: flex; gap: 10px; align-items: center; }
  .chk { display: flex; gap: 8px; align-items: center; }
  #drag { position: fixed; inset: 0; background: rgba(59,130,196,.18); border: 2px dashed var(--accent-2); display: none; place-items: center; font-size: 18px; z-index: 9; }
  #drag.on { display: grid; }
  .titlebar { position: fixed; top: 0; left: 0; right: 0; height: 40px; -webkit-app-region: drag; }
</style>
</head>
<body>
<div class="titlebar"></div>
<div id="wrap">
  <aside id="presets"><h4>Presets</h4></aside>
  <main id="main">
    <div class="card drop">
      <svg viewBox="0 0 24 24" style="width:30px;height:30px"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M10 9.5l5 2.5-5 2.5z"/></svg>
      <div style="flex:1;min-width:0">
        <div class="name" id="srcName">No video selected</div>
        <div class="muted" id="srcInfo">Drop a video here or choose a file to compress.</div>
      </div>
      <button class="btn" id="btnOpen">Choose file…</button>
    </div>

    <div class="card grid" id="settings">
      <div class="field"><label>Video codec</label>
        <select id="codec"><option value="h264">H.264 (most compatible)</option><option value="hevc">H.265 / HEVC (smaller)</option></select></div>
      <div class="field"><label>Resolution</label>
        <select id="height"><option value="">Same as source</option><option value="2160">2160p (4K)</option><option value="1440">1440p</option><option value="1080">1080p</option><option value="720">720p</option><option value="480">480p</option><option value="360">360p</option></select></div>
      <div class="field"><label>Frame rate</label>
        <select id="fps"><option value="">Same as source</option><option value="60">60 fps</option><option value="30">30 fps</option><option value="24">24 fps</option><option value="15">15 fps</option></select></div>
      <div class="field"><label>Audio</label>
        <select id="audio"><option value="keep">Keep (AAC 192 kbps)</option><option value="aac160">AAC 160 kbps</option><option value="aac128">AAC 128 kbps</option><option value="aac96">AAC 96 kbps</option><option value="aac64">AAC 64 kbps</option><option value="none">Remove audio</option></select></div>
      <div class="field full"><label><span>Quality</span><span class="muted" id="qLabel">60</span></label>
        <input type="range" id="quality" min="5" max="100" step="1" value="60" />
        <div class="row muted" style="justify-content:space-between;margin-top:4px"><span>Smaller file</span><span>Higher quality</span></div></div>
      <label class="chk full"><input type="checkbox" id="web" /> Optimize for web streaming (fast start)</label>
    </div>

    <div class="card est">
      <div><div class="muted">Estimated output</div><div class="big" id="estSize">—</div></div>
      <div style="text-align:right"><div class="muted">Video bitrate</div><div class="big" id="estRate">—</div></div>
    </div>

    <div class="card" id="progressCard" hidden>
      <div class="bar"><div id="fill"></div></div>
      <div class="muted" id="status" style="margin-top:8px">Starting…</div>
    </div>

    <div class="row" style="margin-top:auto;justify-content:flex-end">
      <button class="btn" id="btnReveal" hidden>Show in Finder</button>
      <button class="btn" id="btnCancel" hidden>Cancel</button>
      <button class="primary" id="btnStart" disabled>Compress…</button>
    </div>
  </main>
</div>
<div id="drag">Drop video to compress</div>
<script type="module" src="js/compress.js"></script>
</body>
</html>
