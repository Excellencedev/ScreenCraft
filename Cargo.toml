[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/encode",
    "crates/audio",
    "crates/capture",
    "crates/engine",
    "crates/render",
    "crates/app",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "MIT"

[profile.release]
lto = "thin"
codegen-units = 4
