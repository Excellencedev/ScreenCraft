<!--@header-->

<div class="wrap docs"><!--@docs-nav--><article class="prose">
<h1>Shortcuts</h1>
<table><tr><th>Key</th><th>Action</th></tr>
<tr><td><kbd>Space</kbd></td><td>Play / pause (hold for 2× speed)</td></tr>
<tr><td><kbd>Q</kbd> / <kbd>E</kbd></td><td>Jump to start / end</td></tr>
<tr><td><kbd>A</kbd> / <kbd>D</kbd></td><td>Previous / next zoom</td></tr>
<tr><td><kbd>⌘D</kbd></td><td>Duplicate selected block</td></tr>
<tr><td><kbd>⌘Z</kbd> / <kbd>⇧⌘Z</kbd></td><td>Undo / redo</td></tr>
<tr><td><kbd>Esc</kbd></td><td>Close dialog</td></tr></table>
<p>On Windows, use <kbd>Ctrl</kbd> instead of <kbd>⌘</kbd>.</p>
</article></div>
</main>
<!--@footer-->
</body>
</html>
