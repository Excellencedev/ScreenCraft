[package]
name = "screencraft"
version.workspace = true
edition.workspace = true
description = "ScreenCraft - screen recorder and editor"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset", "macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
screencraft-core = { path = "../crates/core" }
screencapturekit = { version = "11", features = ["macos_15_0"] }
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSCursor", "NSEvent", "NSWorkspace", "NSRunningApplication"] }
libc = "0.2"
core-foundation = "0.10"
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media", "objc2-core-video", "AVCaptureDevice", "AVMediaFormat"] }
objc2-core-media = { version = "0.3.2", features = ["CMTime", "CMSampleBuffer", "CMFormatDescription"] }
objc2-foundation = "0.3.2"
